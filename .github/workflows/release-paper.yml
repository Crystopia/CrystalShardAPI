name: Build CrystalShard-Paper

on:
  workflow_dispatch:
  push:
    tags:
      - v.*

jobs:
  publish:
    strategy:
      matrix:
        tasks: [ "box", "core", "util", "dhl", "dhl:converter:1_21_1", "dhl:converter:1_21_9", "dhl:converter:1_21_10", "dhl:converter:1_21_11", "panic", "simulacrum", "folia" ]
    runs-on: ubuntu-latest


    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '26'

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew
      - name: Build crystalshard-paper-${{ matrix.tasks }}
        run: ./gradlew paper:${{ matrix.tasks }}:publish -DREPOSILITE_USER=${{ secrets.REPOSILITE_USER }} -DREPOSILITE_TOKEN=${{ secrets.REPOSILITE_TOKEN }}

      - name: Print reobfJar log
        if: failure()
        run: find . -name "reobfJar.log" -exec cat {} \;